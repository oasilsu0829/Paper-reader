<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 학생의 논문 리딩 노트. 왼쪽 목차 레일 + 72ch 본문 칼럼, 형광펜은 핵심 문장에만 쓴다. */
:root {
  --paper: #f5f7f6;
  --surface: #ffffff;
  --ink: #18212b;
  --ink-2: #4f5b67;
  --rule: #d8dfe2;
  --accent: #2148c9;
  --accent-soft: #e6ecfb;
  --marker-bg: #f4e65c;
  --marker-fg: #18212b;
  --good: #1c7a4e;
  --warn: #a8530f;
  --warn-soft: #fbefe3;
  --bar-muted: #b7c2cc;
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", Georgia, serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2.125rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1417; --surface: #161d22; --ink: #e5eaee; --ink-2: #9ba8b4; --rule: #29333b;
    --accent: #85a5ff; --accent-soft: #1b2645; --marker-bg: #5c5416; --marker-fg: #fff6b8;
    --good: #5cc795; --warn: #f0a160; --warn-soft: #33241a; --bar-muted: #4a5763;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1417; --surface: #161d22; --ink: #e5eaee; --ink-2: #9ba8b4; --rule: #29333b;
  --accent: #85a5ff; --accent-soft: #1b2645; --marker-bg: #5c5416; --marker-fg: #fff6b8;
  --good: #5cc795; --warn: #f0a160; --warn-soft: #33241a; --bar-muted: #4a5763;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.75;
  word-break: keep-all; overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, .fig-zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
mark { background: linear-gradient(transparent 12%, var(--marker-bg) 12%, var(--marker-bg) 88%, transparent 88%); color: var(--marker-fg); padding: 0 .15em; }
code { font-family: var(--font-mono); font-size: .9em; background: var(--accent-soft); padding: .05em .35em; border-radius: 3px; }

.shell { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; padding-block: 40px 96px; }
main { min-width: 0; max-width: 72ch; }

/* ---------- 목차 레일 */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; display: grid; gap: 20px; font-size: var(--step--1); }
.rail-label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; border-left: 1px solid var(--rule); }
.toc a { display: block; padding: 4px 0 4px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--ink-2); text-decoration: none; }
.toc a:hover { color: var(--ink); }
.toc a.on { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
.mode { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.mode button { font: inherit; font-size: var(--step--1); border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mode-hint { color: var(--ink-2); margin: 6px 0 0; line-height: 1.5; }

/* ---------- 머리말 */
.eyebrow { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-3); line-height: 1.3; margin: 14px 0 10px; text-wrap: balance; letter-spacing: -0.01em; }
.orig-title { color: var(--ink-2); font-size: var(--step-0); margin: 0 0 16px; line-height: 1.55; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: var(--step--1); margin: 0 0 6px; }
.meta b { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.chip { font-family: var(--font-mono); font-size: .72rem; border: 1px solid var(--rule); border-radius: 99px; padding: 2px 10px; color: var(--ink-2); background: var(--surface); }
.tldr { margin: 28px 0 0; font-family: var(--font-display); font-weight: 500; font-size: var(--step-1); line-height: 1.75; }
.tldr .rail-label { display: block; margin-bottom: 6px; font-family: var(--font-mono); }

/* ---------- 섹션 */
section { padding-top: 56px; scroll-margin-top: 16px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1.35; margin: 0 0 4px; text-wrap: balance; }
.kicker { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h3 { font-size: var(--step-1); font-weight: 600; margin: 28px 0 8px; text-wrap: balance; line-height: 1.45; }
.prose p { margin: 12px 0; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 10px 0; }
.prose li { margin: 4px 0; }
.prose li::marker { color: var(--ink-2); }
.v-detail { display: none; }
body.detail .v-detail { display: block; }
.v-detail { border-left: 2px solid var(--accent-soft); padding-left: 14px; margin: 12px 0; }
.v-detail > .rail-label { color: var(--accent); }

.points { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; counter-reset: pt; }
.points li { counter-increment: pt; display: grid; grid-template-columns: 2.2em minmax(0, 1fr); align-items: baseline; }
.points li::before { content: counter(pt); font-family: var(--font-mono); font-size: .8rem; color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 20px 0; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat-v { font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-l { font-size: var(--step--1); font-weight: 600; }
.stat-n { font-size: .78rem; color: var(--ink-2); line-height: 1.5; }

.callout { margin: 18px 0; padding: 12px 16px; border-radius: var(--radius); background: var(--accent-soft); font-size: .95rem; }
.callout.warn { background: var(--warn-soft); }
.callout-t { font-weight: 600; display: block; margin-bottom: 2px; }
.callout p { margin: 4px 0; }

.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; margin: 20px 0; }
.flow-step { flex: 1 1 150px; min-width: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; }
.flow-step b { display: block; font-size: .95rem; }
.flow-step span { display: block; font-size: var(--step--1); color: var(--ink-2); line-height: 1.55; margin-top: 2px; }
.flow-arrow { flex: 0 0 auto; align-self: center; display: grid; justify-items: center; padding: 0 6px; color: var(--ink-2); font-size: .72rem; font-family: var(--font-mono); max-width: 90px; text-align: center; line-height: 1.3; }
.flow-arrow::before { content: "→"; font-size: 1.1rem; color: var(--accent); }
.flow.vertical { flex-direction: column; }
.flow.vertical .flow-step { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 10em) minmax(0, 1fr); gap: 4px 14px; align-items: baseline; padding: 10px 14px; }
.flow.vertical .flow-step span { margin: 0; }
.flow.vertical .flow-arrow { max-width: none; padding: 2px 0; grid-auto-flow: column; gap: 8px; align-items: center; justify-content: start; margin-left: 2em; }
.flow.vertical .flow-arrow::before { content: "↓"; }
@media (max-width: 520px) { .flow.vertical .flow-step { grid-template-columns: minmax(0, 1fr); } }
.flow-cap, .chart-cap { font-size: var(--step--1); color: var(--ink-2); margin: 6px 0 0; }

.chart { margin: 22px 0; }
.chart-t { font-weight: 600; font-size: .95rem; margin: 0 0 6px; }
.chart-scroll { overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 420px; height: auto; }
.chart .lbl { fill: var(--ink); font-family: var(--font-body); font-size: 13px; }
.chart .val { fill: var(--ink-2); font-family: var(--font-mono); font-size: 12px; }
.chart .tick { fill: var(--ink-2); font-family: var(--font-mono); font-size: 11px; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .zero { stroke: var(--ink-2); stroke-width: 1; }
.chart .bar { fill: var(--accent); }
.chart .bar.muted { fill: var(--bar-muted); }
.chart .bar.warn { fill: var(--warn); }
.chart .bar.good { fill: var(--good); }

.tbl-wrap { overflow-x: auto; margin: 18px 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; background: var(--paper); }
tr:last-child td { border-bottom: 0; }

.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 18px 0; }
.compare > div { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 16px; min-width: 0; }
.compare h4 { margin: 0 0 4px; font-size: .95rem; }
.compare ul { margin: 0; padding-left: 1.2em; font-size: .95rem; }

pre.mermaid { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px; overflow-x: auto; font-size: var(--step--1); }

/* ---------- 그림 */
.fig { margin: 28px 0 0; padding-top: 24px; border-top: 1px solid var(--rule); scroll-margin-top: 16px; }
.fig-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.fig-label { font-family: var(--font-mono); font-size: .8rem; color: var(--accent); }
.fig h3 { margin: 0; flex: 1 1 260px; }
.fig-zoom { display: block; width: 100%; margin: 14px 0 0; padding: 10px; border: 1px solid var(--rule); border-radius: var(--radius); background: #fff; cursor: zoom-in; }
.fig-zoom img { display: block; margin: 0 auto; max-height: 520px; width: auto; max-width: 100%; }
.fig-zoom-hint { font-size: .75rem; color: var(--ink-2); margin: 4px 0 0; text-align: right; }
.fig-missing { margin: 14px 0 0; padding: 14px 16px; border: 1px dashed var(--rule); border-radius: var(--radius); color: var(--ink-2); font-size: var(--step--1); }
.fig-grid { display: grid; gap: 4px; margin-top: 10px; }
.fig-grid h4 { font-size: var(--step--1); letter-spacing: .04em; color: var(--ink-2); margin: 14px 0 0; font-weight: 600; }
details { margin: 14px 0 0; }
summary { cursor: pointer; color: var(--ink-2); font-size: var(--step--1); }
details[open] summary { margin-bottom: 6px; }
.orig { font-size: var(--step--1); color: var(--ink-2); line-height: 1.65; }

dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
dialog.lightbox::backdrop { background: rgba(10, 14, 18, .86); }
.lb-inner { width: 100%; height: 100%; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.lb-inner img { max-width: 100%; max-height: calc(100vh - 80px); background: #fff; border-radius: 4px; }
.lb-close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px); font: inherit; background: #fff; color: #18212b; border: 0; border-radius: 99px; padding: 6px 14px; cursor: pointer; }

/* ---------- 내 프로젝트 연관성 */
.proj { margin: 18px 0; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; }
.proj-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.proj h3 { margin: 0; }
.fit { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: .75rem; color: var(--ink-2); }
.fit i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rule); }
.fit i.on { background: var(--accent); }
.cite { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--marker-bg); background: var(--paper); font-size: .95rem; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.cite button { font: inherit; font-size: .75rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 4px; padding: 3px 10px; cursor: pointer; }

footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: var(--step--1); color: var(--ink-2); }
footer p { margin: 6px 0; }

@media (max-width: 920px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-block: 0 72px; }
  main { max-width: none; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); padding-block: 10px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-bottom: 24px; }
  .rail > .rail-label, .mode-hint { display: none; }
  .toc { display: flex; overflow-x: auto; border-left: 0; gap: 4px; scrollbar-width: none; }
  .toc a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; padding: 4px 8px; margin: 0; }
  .toc a.on { border-bottom-color: var(--accent); }
  .mode-box { order: 2; }
  section { scroll-margin-top: 64px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell">
  <nav class="rail" aria-label="목차">
    <div class="mode-box">
      <div class="mode" role="group" aria-label="설명 수준">
        <button type="button" id="mode-easy" aria-pressed="true">쉽게</button>
        <button type="button" id="mode-detail" aria-pressed="false">자세히</button>
      </div>
      <p class="mode-hint">쉽게: 비유와 핵심만<br>자세히: 수치와 통계 설명을 더 보여줌</p>
    </div>
    <span class="rail-label">목차</span>
    <ol class="toc">{{TOC}}</ol>
  </nav>
  <main>
{{BODY}}
  </main>
</div>

<dialog class="lightbox" id="lightbox" aria-label="그림 크게 보기">
  <div class="lb-inner"><img id="lb-img" alt=""></div>
  <button type="button" class="lb-close" id="lb-close">닫기</button>
</dialog>

<script>
(function () {
  var body = document.body, easy = document.getElementById('mode-easy'), det = document.getElementById('mode-detail');
  function setMode(d) {
    body.classList.toggle('detail', d);
    easy.setAttribute('aria-pressed', String(!d));
    det.setAttribute('aria-pressed', String(d));
    try { localStorage.setItem('paper-reader-mode', d ? 'detail' : 'easy'); } catch (e) {}
  }
  easy.addEventListener('click', function () { setMode(false); });
  det.addEventListener('click', function () { setMode(true); });
  try { if (localStorage.getItem('paper-reader-mode') === 'detail') setMode(true); } catch (e) {}

  var lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img');
  document.querySelectorAll('.fig-zoom').forEach(function (b) {
    b.addEventListener('click', function () {
      var img = b.querySelector('img');
      lbImg.src = img.src; lbImg.alt = img.alt;
      if (lb.showModal) lb.showModal();
    });
  });
  document.getElementById('lb-close').addEventListener('click', function () { lb.close(); });
  lb.addEventListener('click', function (e) { if (e.target !== lbImg) lb.close(); });

  document.querySelectorAll('.cite button').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.parentNode.querySelector('.cite-text');
      var done = function () { b.textContent = '복사됨'; setTimeout(function () { b.textContent = '복사'; }, 1600); };
      var fallback = function () { var r = document.createRange(); r.selectNodeContents(t); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = '선택됨'; };
      try { navigator.clipboard.writeText(t.innerText).then(done, fallback); } catch (e) { fallback(); }
    });
  });

  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var secs = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); });
  function spy() {
    var y = window.scrollY + 120, cur = 0;
    secs.forEach(function (s, i) { if (s && s.offsetTop <= y) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === cur); });
    var on = links[cur];
    if (on && on.parentNode.parentNode.scrollWidth > on.parentNode.parentNode.clientWidth) {
      var toc = on.parentNode.parentNode, l = on.offsetLeft - toc.offsetLeft;
      if (l < toc.scrollLeft || l > toc.scrollLeft + toc.clientWidth - 60) toc.scrollLeft = l - 20;
    }
  }
  window.addEventListener('scroll', spy, { passive: true });
  spy();
})();
</script>
